name: Update streak stats

on:
  schedule:
    - cron: "0 6 * * *" # every day at 03:00 BRT (06:00 UTC)
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch: # run manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&background=00000000&hide_border=true&stroke=30363D&ring=2F81F7&fire=2F81F7&currStreakNum=2F81F7&currStreakLabel=2F81F7&sideNums=768390&sideLabels=768390&dates=768390&disable_animations=true&card_width=420
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update streak stats" || exit 0
          git push
